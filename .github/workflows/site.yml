name: Build and deploy site

# Builds the questbook site and publishes it to GitHub Pages.
#
# Quest data and the Vending Machine's trades always come from the modpack's master branch.
# Game data (item names and icons) comes from this repository's "game-data" release, which is
# refreshed by running the exporter (export.yml) whenever GTNH publishes a new daily build.
#
# The site is built and deployed straight away with the game data already published, so quest
# changes go live in a few minutes. When there is a new daily build, the export runs alongside,
# and once it has published, the site is built and deployed again with the new game data. If the
# export fails, the site stays deployed with the previous game data.

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/build-site.yml"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      export:
        description: "Run the game-data export"
        type: choice
        options: [if-new-daily, always, never]
        default: if-new-daily

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      export: ${{ steps.check.outputs.export }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Compare the newest daily build with the published game data
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'push' && 'never' || inputs.export || 'if-new-daily' }}
        run: |
          latest=$(gh release list -R GTNewHorizons/GTNH-Daily-Builds --limit 1 --json tagName --jq '.[0].tagName')
          current=$(gh release download game-data -R "$GITHUB_REPOSITORY" -p daily-tag.txt -O - 2>/dev/null || echo none)
          echo "Newest daily build: $latest, published game data: $current, mode: $MODE"
          export=false
          if [ "$MODE" = always ] || { [ "$MODE" = if-new-daily ] && [ "$latest" != "$current" ]; }; then
            export=true
          fi
          echo "export=$export" >> "$GITHUB_OUTPUT"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          {
            echo "Newest daily build: \`$latest\`  "
            echo "Published game data: \`$current\`  "
            echo "Run export: \`$export\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    uses: ./.github/workflows/build-site.yml
    with:
      artifact: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # One deployment at a time; a newer one waits for the one in progress.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

  export:
    needs: check
    if: needs.check.outputs.export == 'true'
    # Two exports at once would both replace the game-data release.
    concurrency:
      group: export
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/export.yml
    with:
      daily_tag: ${{ needs.check.outputs.tag }}
      publish: true

  rebuild:
    # After the first deployment too, so the one with the new game data is the one that stays.
    needs: [export, deploy]
    if: always() && needs.export.result == 'success'
    uses: ./.github/workflows/build-site.yml
    with:
      artifact: github-pages-game-data
      # The newest site code: anything pushed while the export ran has been deployed already.
      ref: master

  redeploy:
    needs: rebuild
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-game-data
